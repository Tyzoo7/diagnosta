name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (Windows)
    runs-on: windows-latest
    timeout-minutes: 15

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      # Actions are pinned to exact commits so a hijacked tag cannot change what runs here.
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Always the newest .NET 10 patch: the exe bundles this runtime, so it must
      # include the latest security fixes (the preinstalled SDK can lag a month behind).
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore (locked versions only)
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      # Puts the names and messages of failed tests on the pull request page, so nobody
      # has to dig through the raw log to find out what broke.
      - name: Show failed tests on the pull request
        if: failure()
        shell: pwsh
        run: |
          $output = & tests/Diagnosta.Tests/bin/Release/net10.0/Diagnosta.Tests.exe 2>&1 | Out-String
          $exitCode = $LASTEXITCODE
          $lines = $output -split "\r?\n" | Where-Object { $_.Trim() } | Select-Object -Last 60
          # Workflow commands need %, CR and LF escaped.
          $message = ($lines | ForEach-Object { $_ -replace '%', '%25' }) -join '%0A'
          Write-Output "::error title=Failed tests (exit code $exitCode)::$message"
          exit 0

      - name: Show .NET version used
        run: dotnet --info

      # Trimming drops unused parts of .NET (~75 MB -> ~14 MB). Trim warnings fail the
      # build because TreatWarningsAsErrors is on.
      - name: Publish standalone exe
        run: >-
          dotnet publish src/Diagnosta --configuration Release --runtime win-x64 --self-contained
          -p:PublishSingleFile=true -p:PublishTrimmed=true --output publish

      - name: Smoke test (the exact exe users download)
        shell: pwsh
        run: |
          $exe = "publish/Diagnosta.exe"
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "--version failed" }
          & $exe --lang en
          if ($LASTEXITCODE -ne 0) { throw "system overview (English) failed" }
          & $exe --lang de
          if ($LASTEXITCODE -ne 0) { throw "system overview (German) failed" }

      - name: Record size and SHA-256 fingerprint
        shell: pwsh
        run: |
          $file = Get-Item "publish/Diagnosta.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash
          $sizeMb = [math]::Round($file.Length / 1MB, 1)
          "### Diagnosta.exe (win-x64)" >> $env:GITHUB_STEP_SUMMARY
          "| Size | SHA-256 |" >> $env:GITHUB_STEP_SUMMARY
          "|---|---|" >> $env:GITHUB_STEP_SUMMARY
          "| $sizeMb MB | ``$hash`` |" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload exe
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Diagnosta-win-x64
          path: publish/Diagnosta.exe
          if-no-files-found: error
          retention-days: 14
