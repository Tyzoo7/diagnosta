name: Release

# Started by hand: Actions -> Release -> "Run workflow", then enter a version like 0.5.0.
# Publishing a version is a deliberate decision by the maintainer, not an automatic one.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.5.0 (must match <Version> in Diagnosta.csproj)"
        required: true
        type: string

# Nothing by default; each job asks only for what it needs.
permissions: {}

jobs:
  build:
    name: Build & test release exe
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # User input is only ever read from an environment variable, never pasted into a
      # script with ${{ }}: that would allow script injection.
      VERSION: ${{ inputs.version }}
      TAG: v${{ inputs.version }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Check the requested version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }} # read-only here (job permission: contents: read)
        run: |
          if ($env:GITHUB_REF -ne "refs/heads/main") {
            throw "Releases are only made from main (this run is on $env:GITHUB_REF)."
          }
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw "'$env:VERSION' is not a version like 0.5.0."
          }
          $projectVersion = ([xml](Get-Content src/Diagnosta/Diagnosta.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($env:VERSION -ne $projectVersion) {
            throw "You entered $env:VERSION, but Diagnosta.csproj says <Version>$projectVersion</Version>."
          }
          gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:TAG" --silent 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "$env:TAG already exists. Releases cannot be changed; raise the version instead."
          }
          $global:LASTEXITCODE = 0

      - name: Restore (locked versions only)
        run: dotnet restore --locked-mode

      - name: Test
        run: dotnet test --configuration Release

      - name: Publish standalone exe
        run: >-
          dotnet publish src/Diagnosta --configuration Release --runtime win-x64 --self-contained
          -p:PublishSingleFile=true -p:PublishTrimmed=true --output publish

      - name: Smoke test
        shell: pwsh
        run: |
          & publish/Diagnosta.exe --version
          if ($LASTEXITCODE -ne 0) { throw "--version failed" }
          & publish/Diagnosta.exe --lang en
          if ($LASTEXITCODE -ne 0) { throw "system overview failed" }

      - name: Name the exe and write checksums
        shell: pwsh
        run: |
          $name = "Diagnosta-$env:TAG-win-x64.exe"
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item publish/Diagnosta.exe "release/$name"
          $hash = (Get-FileHash "release/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          # Same format as sha256sum, so it can be checked on Linux too.
          "$hash  $name" | Out-File -Encoding ascii -NoNewline release/SHA256SUMS.txt

      - name: Hand the files to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only this job may write, and it runs no project code.
    permissions:
      contents: write
      id-token: write # for the attestation below
      attestations: write

    steps:
      - name: Get the files from the build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      # A signed record that this exe was built by this workflow from this repository,
      # checkable with "gh attestation verify". Free for public repositories only.
      - name: Attest build provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.exe

      # Draft first, attach files, then publish: required for immutable releases,
      # where nothing can be added or changed after publishing.
      # GitHub creates the tag on the exact commit that was built and tested ($GITHUB_SHA)
      # when the release is published.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ inputs.version }}
        run: |
          prerelease=""
          if [[ "$TAG" == v0.* ]]; then prerelease="--prerelease"; fi
          gh release create "$TAG" release/* --draft --target "$GITHUB_SHA" --generate-notes --title "Diagnosta $TAG" $prerelease
          gh release edit "$TAG" --draft=false
